[package]
name = "magicblock-sync"
version = "0.2.0"
edition = "2021"
description = "Real-time synchronization of magicblock delegation records"
readme = "README.md"

[dependencies]
futures = "0.3"
# Pinned to the same rev as magicblock-validator's workspace so both build one laserstream copy.
helius-laserstream = { git = "https://github.com/magicblock-labs/laserstream-sdk", rev = "295e8528662c1a9b486385643ba10434f3f210cf" }
tokio = { version = "1.0", features = ["sync", "macros"] }
tracing = "0.1"
