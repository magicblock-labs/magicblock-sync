[package]
name = "magicblock-sync"
version = "0.1.0"
edition = "2021"
description = "Real-time synchronization of magicblock delegation records"
readme = "README.md"

[dependencies]
futures = "0.3"
helius-laserstream = { git = "https://github.com/magicblock-labs/laserstream-sdk", branch = "v0.2.8+conn-fix" } # rust version "0.1.5" + conn fix
tokio = { version = "1.0", features = ["sync", "macros"] }
tracing = "0.1"
