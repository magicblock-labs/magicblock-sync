[package]
name = "magicblock-chainsync"

description = "Base-layer account synchronization for MagicBlock"
edition = "2021"
readme = "README.md"
version = "0.1.0"

[dependencies]
ahash = "0.8"
base64 = "0.22"
bincode = "1.3.3"
borsh = "1"
derive_more = { version = "2.1.1", features = ["debug", "display", "error"] }
fastwebsockets = { version = "0.10", features = ["unstable-split", "upgrade"] }
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
json = { version = "0.5.8", package = "sonic-rs" }
engine = { package = "magicblock-engine", path = "../engine/engine" }
nucleus = { package = "magicblock-engine-nucleus", path = "../engine/nucleus" }
magicblock-delegation-program-api = { git = "https://github.com/magicblock-labs/delegation-program.git", rev = "fb6668c7b5ffd6a89bedee1d13b16402fd0e65de", default-features = false, features = ["encryption", "instruction"] }
magicblock-magic-program-api = { path = "../mbv/programs/magic-interface" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
smallvec = "1"
solana-account = { path = "../engine/solana/account" }
solana-instruction = { version = "3", features = ["wincode"] }
solana-loader-v3-interface = { version = "7.0.0", features = ["serde"] }
solana-loader-v4-interface = "3.1.0"
solana-program-option = "3.0"
solana-program-pack = "3.0"
solana-pubkey = "=4.2.0"
solana-rent = "4.3.0"
solana-sdk-ids = "3.1.0"
spl-associated-token-account-interface = "2.0"
spl-token-interface = "2.0"
spl-token-2022-interface = "2.1"
thiserror = "2"
tokio = { version = "1.0", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
url = "2.5"
webpki-roots = "1"
yellowstone-grpc-client = "13.5.1"
yellowstone-grpc-proto = "12.7.0"
zstd = "0.13"

[dev-dependencies]
hyper = { version = "1", features = ["server"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.28"
engine = { package = "magicblock-engine", path = "../engine/engine", features = ["testkit"] }
keeper = { package = "magicblock-keeper", path = "../engine/keeper", features = ["testkit"] }
magicblock-program = { path = "../mbv/programs/magic-program" }
solana-keypair = "3"
solana-program-runtime = { path = "../engine/solana/program-runtime" }
nucleus = { package = "magicblock-engine-nucleus", path = "../engine/nucleus", features = ["testkit"] }
solana-account = { path = "../engine/solana/account", features = ["testkit"] }
tokio = { version = "1", features = ["test-util"] }
yellowstone-grpc-geyser = { git = "https://github.com/rpcpool/yellowstone-grpc.git", rev = "5e76c224f693ddb71ee442aa55372a9c4a5f9cee" }
yellowstone-plugin-proto = { package = "yellowstone-grpc-proto", git = "https://github.com/rpcpool/yellowstone-grpc.git", rev = "5e76c224f693ddb71ee442aa55372a9c4a5f9cee", features = ["account-data-as-bytes"] }
v42-calculator-interface = { path = "../engine/programs/v42-calculator-interface", features = ["builder"] }

[patch.crates-io]
agave-transaction-view = { path = "../engine/solana/transaction-view" }
solana-account = { path = "../engine/solana/account" }
solana-program-runtime = { path = "../engine/solana/program-runtime" }
solana-svm = { path = "../engine/solana/svm" }
solana-transaction-context = { path = "../engine/solana/transaction-context" }

[patch."https://github.com/magicblock-labs/magicblock-engine.git"]
magicblock-engine-nucleus = { path = "../engine/nucleus" }
