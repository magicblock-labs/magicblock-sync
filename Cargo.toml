[package]
name = "magicblock-sync"

description = "Base-layer account synchronization for MagicBlock"
edition = "2021"
readme = false
version = "0.1.0"

[dependencies]
ahash = "0.8"
base64 = "0.22"
bincode = "1.3.3"
derive_more = { version = "2.1.1", features = ["debug", "display", "error"] }
fastwebsockets = { version = "0.10", features = ["unstable-split", "upgrade"] }
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
json = { version = "0.5.8", package = "sonic-rs" }
accountsdb = { package = "magicblock-accountsdb", git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.11.0" }
engine = { package = "magicblock-engine", git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.11.0" }
magicblock-delegation-program-api = { git = "https://github.com/magicblock-labs/delegation-program.git", rev = "fb6668c7b5ffd6a89bedee1d13b16402fd0e65de", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
solana-account = { version = "=4.3.1", git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.11.0" }
solana-loader-v3-interface = { version = "7.0.0", features = ["serde"] }
solana-loader-v4-interface = "3.1.0"
solana-pubkey = "=4.2.0"
solana-rent = "4.3.0"
solana-sdk-ids = "3.1.0"
thiserror = "2"
tokio = { version = "1.0", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
url = "2.5"
webpki-roots = "1"
yellowstone-grpc-client = "13.5.1"
yellowstone-grpc-proto = "12.7.0"
zstd = "0.13"

[patch.crates-io]
agave-transaction-view = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.11.0" }
solana-account = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.11.0" }
solana-program-runtime = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.11.0" }
solana-svm = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.11.0" }
solana-transaction-context = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.11.0" }
